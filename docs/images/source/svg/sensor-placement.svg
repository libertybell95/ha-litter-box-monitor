<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#F8FAFC"/>
<!-- floor ellipses -->
<ellipse cx="385" cy="859" rx="268" ry="34" fill="#E2E8F0"/>
<ellipse cx="1152" cy="859" rx="268" ry="34" fill="#E2E8F0"/>

<!-- FRONT: globe drawn as a three-quarter form -->
<path d="M139 516 C139 344 245 212 399 212 C551 212 657 350 657 515 C657 663 575 754 522 789 L265 789 C196 748 139 649 139 516 Z" fill="#94A3B8"/>
<!-- upper side turning surface: use paper highlight, not gradients -->
<path d="M531 267 C604 314 648 405 648 521 C648 625 615 704 551 752 C592 645 596 518 582 406 C573 347 552 297 531 267 Z" fill="#E2E8F0"/>
<!-- entrance shadow/outer ink boundary and light ring -->

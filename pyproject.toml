[project]
name = "ha-litter-box-monitor"
version = "0.1.0"
description = "Home Assistant custom integration turning litter box door sensors into a virtual appliance"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.372",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC", "DTZ", "PT", "LOG", "G"]
ignore = [
  "E501",     # handled by the formatter
  "PLR0911",  # state machine branches read better inline
  "PLR0912",
  "PLR0913",
  "PLR2004",  # magic values are fine in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.litter_box_monitor"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "PLC0415", "SLF001"]
